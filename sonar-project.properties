# KN·QA Observatory — análisis SonarCloud (automatic analysis)
# Sitio estático de reportes QA: HTML multipágina con shell estático (fallback sin JS)
# y datos generados por tools/build_data.py.

# Librerías de terceros localizadas en assets/vendor/ (Chart.js, GSAP, ScrollTrigger, Lenis)
sonar.exclusions=assets/vendor/**,assets/js/data/**
sonar.coverage.exclusions=assets/vendor/**,assets/js/data/**

# CPD: el shell estático de cada página (rail, drawer, topbar, command palette, footer)
# se duplica por diseño —el fallback sin JavaScript exige navegación estática en cada HTML—
# y assets/js/data/ está generado por build_data.py. La lógica propia (assets/js/core,
# assets/js/charts.js) sí queda medida por duplicación.
sonar.cpd.exclusions=**/*.html,assets/js/data/**,assets/vendor/**
